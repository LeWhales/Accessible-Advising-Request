<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="AccessibleAdvising.js" defer></script>
</head>

<main>
    <h1> Accessible Advising Request</h1>
    <p>Fields marked “required” must be completed.</p>
</main>

<form>
    <div>
        <label for="Student-name">your name</label>
        <input id="Student-name" name="Student-name" type="text" autocomplete="name" required>required

    </div>
    <div>
        <label for="Student-Email">your email</label>
        <input id="Student-email" email="Student-email" type="text" autocomplete="email" required>required
    </div>


    <div>
        <label for="Student-field">your field </label>
        <input id="Student-field" email="Student-field" type="text" autocomplete="field" required>required
    </div>
    <div>
        <label for="Day-schedule">Day to schedule </label>
        <input id="Day-schedule" Day="Day-schedule" type="text" autocomplete="Day" required>required
    </div>
    <div>
        <label for="Time-schedule">Time schedule </label>
        <input id="Time-schedule" schedule="Time-schedule" type="text" autocomplete="schedule" required>required
    </div>
    <button type="submit">enter</button>
</form>

</html>
